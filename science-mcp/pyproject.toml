[project]
name = "science-mcp"
version = "0.1.0"
description = "Safe local Science MCP Server for university mathematics and physics calculations (Theorem)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.9.0",
    "mcp>=1.9.0",
    "numpy>=2.0.0",
    "pint>=0.24.4",
    "scipy>=1.14.0",
    "sympy>=1.13.3",
]

[project.scripts]
science-mcp = "science_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/science_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
