<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormulaDesk Phase 0 — PDF.js Viewer PoC</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; display: grid; grid-template-rows: 48px 1fr; height: 100vh; }
      header { display: flex; gap: 8px; align-items: center; padding: 0 12px; border-bottom: 1px solid #d1d5db; background: #f8fafc; }
      main { display: grid; grid-template-columns: 180px 1fr; overflow: hidden; }
      #thumbs { overflow-y: auto; border-right: 1px solid #e5e7eb; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
      #thumbs canvas { width: 100%; border: 1px solid #cbd5e1; cursor: pointer; }
      #stage { overflow: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: #e2e8f0; }
      #page-wrap { position: relative; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
      #text-layer { position: absolute; inset: 0; overflow: hidden; line-height: 1; opacity: 0.25; }
      #text-layer span { position: absolute; white-space: pre; cursor: text; color: transparent; }
    </style>
  </head>
  <body>
    <header>
      <input type="file" id="file-input" accept="application/pdf" />
      <button id="prev-btn">前ページ</button>
      <span id="page-info">0 / 0</span>
      <button id="next-btn">次ページ</button>
      <button id="zoom-out">-</button>
      <span id="zoom-info">100%</span>
      <button id="zoom-in">+</button>
      <button id="export-png">現在ページをPNG化</button>
    </header>
    <main>
      <aside id="thumbs"></aside>
      <section id="stage">
        <div id="page-wrap">
          <canvas id="pdf-canvas"></canvas>
          <div id="text-layer"></div>
        </div>
        <pre id="extracted-text" style="max-width: 800px; white-space: pre-wrap; background: white; padding: 12px;"></pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
