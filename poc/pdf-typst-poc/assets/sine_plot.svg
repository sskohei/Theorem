<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <rect width="480" height="240" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="50" y1="40" x2="450" y2="40"/>
    <line x1="50" y1="80" x2="450" y2="80"/>
    <line x1="50" y1="120" x2="450" y2="120"/>
    <line x1="50" y1="160" x2="450" y2="160"/>
    <line x1="50" y1="200" x2="450" y2="200"/>
    <line x1="150" y1="30" x2="150" y2="210"/>
    <line x1="250" y1="30" x2="250" y2="210"/>
    <line x1="350" y1="30" x2="350" y2="210"/>
  </g>
  <!-- Axes -->
  <line x1="50" y1="120" x2="455" y2="120" stroke="#111827" stroke-width="1.5"/>
  <line x1="50" y1="210" x2="50" y2="25" stroke="#111827" stroke-width="1.5"/>
  <!-- Damped harmonic oscillation y = exp(-0.25 t) * cos(2 t) -->
  <path d="M 50 40 C 70 40, 82 120, 100 182 C 118 205, 132 160, 150 100 C 168 55, 182 70, 200 120 C 218 165, 232 155, 250 115 C 268 85, 282 92, 300 120 C 318 143, 332 138, 350 118 C 368 103, 382 108, 400 120 C 418 130, 432 126, 450 119"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Envelope -->
  <path d="M 50 40 Q 170 85, 450 114" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,4"/>
  <path d="M 50 200 Q 170 155, 450 126" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,4"/>
  <!-- Labels -->
  <text x="250" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827">Damped Oscillation: x(t) = A exp(-gamma t) cos(omega t)</text>
  <text x="458" y="124" font-family="sans-serif" font-size="11" fill="#111827">t</text>
  <text x="35" y="26" font-family="sans-serif" font-size="11" fill="#111827">x(t)</text>
  <text x="315" y="54" font-family="sans-serif" font-size="10" fill="#dc2626">envelope: +/- A exp(-gamma t)</text>
</svg>
